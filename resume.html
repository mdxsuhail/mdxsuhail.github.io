<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume | Mohammed Suhail</title>
<style>
:root{--ink:#111;--mut:#555;--line:#ddd;--acc:#00766f}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f4;color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tools{max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;gap:10px}
.tools button,.tools a{font:600 14px system-ui,sans-serif;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.tools button{background:var(--acc);color:#fff;border-color:var(--acc)}
.page{max-width:820px;margin:16px auto 40px;background:#fff;padding:48px 52px;border:1px solid var(--line)}
h1{font-size:2rem;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em}
.role{color:var(--mut);margin:0 0 8px}
.links a{color:var(--acc);margin-right:16px;text-decoration:none;font-weight:600}
h2{font-size:.95rem;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);letter-spacing:.02em}
p{margin:0 0 8px}
.skills{display:grid;grid-template-columns:150px 1fr;gap:4px 16px}
.skills b{font-weight:600}
.item{margin:0 0 12px;break-inside:avoid}
.item h3{font-size:1rem;margin:0}
.item h3 a{color:var(--ink);text-decoration:none}
.item small{color:var(--mut)}
.edit{color:var(--mut);font-style:italic}
.row{display:flex;justify-content:space-between;gap:12px}
.chips{margin:0;padding:0;list-style:none}
ul.list{margin:0;padding-left:18px}
@media(max-width:600px){.page{padding:28px 22px}.skills{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .tools{display:none}
  .page{margin:0;border:0;padding:0;max-width:none}
  .links a{color:var(--ink)}
}
</style>
</head>
<body>
<div class="tools"><button type="button" onclick="window.print()">Print or save as PDF</button><a href="index.html">Back to site</a></div>
<main class="page" id="page"><p class="edit">Loading resume...</p></main>
<script>
var USER="mdxsuhail",HIDE=[USER,USER+".github.io","portfolio"];
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function sec(root,title,list){if(!list||!list.length)return null;root.appendChild(el("h2","",title));var d=el("div");root.appendChild(d);return d}
function proj(box,p){
  var d=el("div","item"),h=el("h3");
  if(p.url){var a=el("a","",p.name);a.href=p.url;h.appendChild(a)}else h.textContent=p.name;
  d.appendChild(h);
  if(p.description)d.appendChild(el("p","",p.description));
  if(p.tech)d.appendChild(el("small","",p.tech));
  box.appendChild(d);
}
function render(D){
  var root=document.getElementById("page");root.textContent="";
  root.appendChild(el("h1","",D.name));
  root.appendChild(el("p","role",D.role));
  var ln=el("p","links");(D.links||[]).forEach(function(l){var a=el("a","",l.label);a.href=l.url;ln.appendChild(a)});root.appendChild(ln);
  if(D.objective){root.appendChild(el("h2","","Objective"));root.appendChild(el("p","",D.objective))}
  var b=sec(root,"Education",D.education);
  if(b)D.education.forEach(function(e){
    var d=el("div","item"),r=el("div","row");r.appendChild(el("b","",e.degree));r.appendChild(el("small","",e.year||""));d.appendChild(r);
    d.appendChild(el("p","",e.school));b.appendChild(d)});
  b=sec(root,"Skills",D.skills);
  if(b){b.className="skills";D.skills.forEach(function(s){b.appendChild(el("b","",s.group));b.appendChild(el("span","",s.items.join(", ")))})}
  b=sec(root,"Certificates",D.certificates);
  if(b)D.certificates.forEach(function(c){
    var d=el("div","item"),r=el("div","row"),h=el("b");
    if(c.url){var a=el("a","",c.name);a.href=c.url;h.appendChild(a)}else h.textContent=c.name;
    r.appendChild(h);r.appendChild(el("small","",c.year||""));d.appendChild(r);
    if(c.issuer)d.appendChild(el("small","",c.issuer));b.appendChild(d)});
  b=sec(root,"Achievements",D.achievements);
  if(b){var u=el("ul","list");D.achievements.forEach(function(x){u.appendChild(el("li","",x))});b.appendChild(u)}
  var P=D.projects||{};
  var pbox=sec(root,"Projects",[1]);
  (P.extra||[]).forEach(function(p){proj(pbox,p)});
  if(P.fromGitHub){
    fetch("https://api.github.com/users/"+USER+"/repos?per_page=100&sort=pushed&type=owner")
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(all){
      all.filter(function(r){return !r.fork&&!r.archived&&HIDE.indexOf(r.name)===-1&&(r.topics||[]).indexOf("hidden")===-1})
        .slice(0,P.max||6).forEach(function(r){proj(pbox,{name:r.name,url:r.html_url,description:r.description,tech:[r.language].concat(r.topics||[]).filter(Boolean).join(", ")})});
    }).catch(function(){});
  }
}
fetch("resume-data.json?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render)
.catch(function(){document.getElementById("page").textContent="Could not load resume-data.json. Make sure it sits next to this file on your site."});
</script>
</body>
</html>
